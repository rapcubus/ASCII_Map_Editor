<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Map Editor | RAPCUBUS LAB</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <header class="glass">
        <div class="logo">
            <i data-lucide="layout"></i>
            ASCII<span>Studio</span>
        </div>
        <div class="header-actions">
            <div class="action-group">
                <button class="btn-tool" id="undo-btn" title="실행 취소 (Ctrl+Z)"><i data-lucide="undo"></i></button>
                <button class="btn-tool" id="redo-btn" title="다시 실행 (Ctrl+Y)"><i data-lucide="redo"></i></button>
            </div>
            <div class="divider"></div>
            <div class="action-group">
                <button class="btn-tool" id="import-btn" title="가져오기"><i data-lucide="file-input"></i> 가져오기</button>
                <button class="btn-primary" id="export-btn" title="ASCII 내보내기"><i data-lucide="download"></i>
                    내보내기</button>
            </div>
        </div>
    </header>

    <main>
        <aside class="glass">
            <section>
                <h3 class="section-title">편집 도구</h3>
                <div class="tool-grid">
                    <button class="btn-tool active" data-tool="brush" id="tool-brush">
                        <i data-lucide="paintbrush"></i>
                        브러시
                    </button>
                    <button class="btn-tool" data-tool="eraser" id="tool-eraser">
                        <i data-lucide="eraser"></i>
                        지우개
                    </button>
                    <button class="btn-tool" data-tool="fill" id="tool-fill">
                        <i data-lucide="droplet"></i>
                        채우기
                    </button>
                    <button class="btn-tool" id="clear-btn">
                        <i data-lucide="trash-2"></i>
                        초기화
                    </button>
                </div>
            </section>

            <section>
                <h3 class="section-title">문자 타일 팔레트</h3>
                <div class="palette-list" id="char-palette">
                    <!-- JS에서 동적으로 생성됨 -->
                </div>
                <button class="btn-tool" id="sidebar-add-tile-btn"
                    style="width: 100%; margin-top: 12px; font-size: 0.8rem;">
                    <i data-lucide="plus" style="width: 14px; height: 14px;"></i> 새 타일 추가
                </button>
            </section>

            <section>
                <h3 class="section-title">그리드 설정</h3>
                <div style="display: flex; gap: 8px; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
                        <span>너비 (W)</span>
                        <input type="number" id="grid-w" value="30" min="5" max="100"
                            style="width: 60px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 4px; border-radius: 4px;">
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
                        <span>높이 (H)</span>
                        <input type="number" id="grid-h" value="20" min="5" max="100"
                            style="width: 60px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 4px; border-radius: 4px;">
                    </div>
                    <button class="btn-tool" id="resize-btn" style="width: 100%; margin-top: 8px;">그리드 크기 변경</button>
                </div>
            </section>
        </aside>

        <section class="editor-container">
            <div id="map-grid"></div>
        </section>
    </main>



    <!-- Export Modal -->
    <div class="modal-overlay" id="export-modal">
        <div class="modal-content glass animate-in">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 1.5rem; font-weight: 700;">ASCII 내보내기 결과</h2>
                <button class="btn-tool" id="close-export-modal"><i data-lucide="x"></i></button>
            </div>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">아래 코드를 복사하여 저장하거나 공유하세요.</p>
            <textarea id="export-area" readonly></textarea>
            <button class="btn-primary" id="copy-btn">클립보드에 복사</button>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal-overlay" id="import-modal">
        <div class="modal-content glass animate-in">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 1.5rem; font-weight: 700;">ASCII 가져오기</h2>
                <button class="btn-tool" id="close-import-modal"><i data-lucide="x"></i></button>
            </div>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">여기에 ASCII 문자열을 붙여넣으세요.</p>
            <textarea id="import-area" placeholder="/* 타일 범례 ... */ 또는 맵 데이터를 직접 입력하세요."></textarea>
            <button class="btn-primary" id="import-exec-btn">가져오기 실행</button>
        </div>
    </div>

    <!-- Tile Edit Modal -->
    <div class="modal-overlay" id="palette-modal">
        <div class="modal-content glass animate-in" style="width: 400px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 1.25rem; font-weight: 700;" id="tile-modal-title">타일 수정</h2>
                <button class="btn-tool" id="close-palette-modal"><i data-lucide="x"></i></button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 10px;">
                <!-- 1. 문자 입력 (필수) -->
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 600;">타일 문자 (필수 1글자)</label>
                    <input type="text" id="edit-tile-char" maxlength="1" class="glass" placeholder="예: #, @, ."
                        style="padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: white; font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; text-align: center; width: 80px;">
                </div>

                <!-- 2. 라벨 입력 -->
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 600;">타일 이름 (Label)</label>
                    <input type="text" id="edit-tile-label" class="glass" placeholder="예: 벽, 바닥, 캐릭터..."
                        style="padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: white;">
                </div>

                <!-- 3. 이모지 설정 (연결성 강조) -->
                <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 10px; border-top: 1px solid var(--border);">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="use-emoji-check" style="width: 18px; height: 18px; cursor: pointer;">
                        <label for="use-emoji-check" style="font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                            <i data-lucide="smile" style="width: 18px; height: 18px; color: var(--accent);"></i>
                            이모지 매핑 사용
                        </label>
                    </div>

                    <div id="emoji-selection-area" style="display: none; flex-direction: column; gap: 8px;">
                        <div id="emoji-picker-list" class="emoji-grid glass">
                            <!-- JS에서 이모지 목록 생성 -->
                        </div>
                        <input type="hidden" id="selected-emoji" value="">
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 10px;">
                <button class="btn-primary" id="save-tile-btn" style="flex: 1;">저장하기</button>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div class="modal-overlay" id="alert-modal" style="z-index: 2000;">
        <div class="modal-content glass animate-in" style="width: 400px; text-align: center;">
            <div style="font-size: 3rem; color: #ef4444; margin-bottom: 10px;">
                <i data-lucide="alert-circle"></i>
            </div>
            <h2 style="font-size: 1.25rem; font-weight: 700;">알림</h2>
            <p id="alert-message" style="color: var(--text-secondary); margin-bottom: 24px;">내용</p>
            <button class="btn-primary" id="alert-ok" style="width: 100%;">확인</button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-content glass animate-in" style="width: 400px; text-align: center;">
            <div style="font-size: 3rem; color: #f59e0b; margin-bottom: 10px;">
                <i data-lucide="alert-triangle"></i>
            </div>
            <h2 id="confirm-title" style="font-size: 1.25rem; font-weight: 700;">확인</h2>
            <p id="confirm-message" style="color: var(--text-secondary); margin-bottom: 24px;">내용</p>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button class="btn-tool" id="confirm-cancel">취소</button>
                <button class="btn-primary" id="confirm-ok" style="background: #ef4444;">실행</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
